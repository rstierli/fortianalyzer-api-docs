stages:
  - build
  - mirror

# Build stage
pages:
  image: gitlab.frval.fortinet-emea.com:4567/support/cse-intl-cmm/cmm-sphinx-docker-image/sphinx-multiarch:latest
  stage: build
  script:
    - echo "Loading environment variables..."
    - source config/project.env || { echo "Failed to load environment variables"; exit 1; }
    
    # Install optional Python packages from optional_packages.conf
    - |
      if [ -f "config/optional_packages.conf" ]; then
        echo "Installing optional Python packages from optional_packages.conf..."
        while IFS= read -r package || [ -n "$package" ]; do
          if [[ ! -z "$package" && "$package" != \#* ]]; then
            echo "Installing: $package"
            pip install "$package" || { echo "Failed to install $package"; exit 1; }
          fi
        done < "config/optional_packages.conf"
        echo "All optional packages have been installed."
      else
        echo "No optional packages to install."
      fi
      
    - echo "Starting Sphinx build process..."
    - sphinx-build -b html doc public || { echo "Sphinx build failed"; exit 1; }
    - echo "Deploying to GitLab Pages"

  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH

# Mirror stage - automatically sync to GitHub for Read the Docs
mirror_to_github:
  stage: mirror
  image: alpine/git:latest
  only:
    - main
  before_script:
    # Configure git with your identity
    - git config --global user.name "${GITLAB_USER_NAME}"
    - git config --global user.email "${GITLAB_USER_EMAIL}"
  script:
    # Add GitHub as a remote (if not already added)
    - git remote add github https://${GITHUB_USERNAME}:${GITHUB_TOKEN}@github.com/rstierli/fortianalyzer-api-docs.git || true
    # Push to GitHub
    - git push github HEAD:main --force
  rules:
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH
